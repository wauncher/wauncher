name: release

# Two ways to cut a release:
#   * push a tag like v20261004.09: builds that commit, stamps the version from the tag, publishes a release
#     of the same name;
#   * "Run workflow" in the Actions tab (workflow_dispatch): builds the chosen branch, stamps the version you
#     type (or the next build number for today) and publishes a release for it.
# Both produce the single-file exe and a zip of the one-folder build and attach them to the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp and release as (YYYYMMDD.XX); empty = next build number for today"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build requirements
        run: python -m pip install -r requirements.txt

      - name: Stamp the version (from the tag, or the manual input)
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v -and "${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          if ($v) { python tools/bump_version.py $v | Out-Null } else { python tools/bump_version.py | Out-Null }
          $stamped = (Select-String -Path app/version.py -Pattern '"([0-9.]+)"').Matches[0].Groups[1].Value
          "tag=v$stamped" >> $env:GITHUB_OUTPUT
          "stamped version $stamped"

      - name: Draw the icon
        run: python tools/make_icon.py

      - name: Build (single file)
        run: python -m PyInstaller --noconfirm --clean wauncher.spec

      - name: Build (one folder)
        run: python -m PyInstaller --noconfirm --clean wauncher-onedir.spec

      - name: Zip the one-folder build
        shell: pwsh
        run: Compress-Archive -Path dist/wauncher/* -DestinationPath "dist/wauncher-${{ steps.ver.outputs.tag }}-folder.zip"

      - name: Create (or update) the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $files = Get-ChildItem dist/wauncher_*.exe, dist/*.zip | ForEach-Object FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --title "wauncher $tag" --generate-notes --target "${{ github.sha }}"
          }
